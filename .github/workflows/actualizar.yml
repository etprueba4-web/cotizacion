name: Actualizar tipo de cambio

on:
  schedule:
    - cron: "0 5 * * *"   # 1:00 AM Bolivia (UTC-4)
    - cron: "0 17 * * *"  # 1:00 PM Bolivia (UTC-4)
  workflow_dispatch:       # Permite ejecutarlo manualmente

permissions:
  contents: write

concurrency:
  group: actualizar-tipo-cambio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Descomenta SOLO si algún banco usa  "modo": "playwright"  en bancos.py
      # - name: Instalar Playwright
      #   run: |
      #     pip install playwright
      #     playwright install --with-deps chromium

      - name: Obtener tipos de cambio
        run: python actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar tipo de cambio"
            git pull --rebase
            git push
          fi
